services:
  classmateai_postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: classmateai
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@classmateai.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - classmateai_postgres

volumes:
  dbdata:
